name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} (jane ${{ matrix.jane }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
        jane: ['6']
        include:
          - { php: '8.1', jane: '7' }
          - { php: '8.2', jane: '7' }
          - { php: '8.3', jane: '7' }
          - { php: '8.4', jane: '7' }

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          coverage: none
          tools: composer:v2

      - name: Switch to Jane runtime 7.x
        if: matrix.jane == '7'
        run: |
          composer remove --no-update --dev jane-php/open-api-3 cweagans/composer-patches
          composer require --no-update "jane-php/open-api-runtime:^7"

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run tests
        run: vendor/bin/phpunit
